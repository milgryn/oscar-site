<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSCAR Mobile</title>
<meta name="description" content="OSCAR Mobile : votre boucherie à distance.">
<meta name="theme-color" content="#8e1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OSCAR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* OSCAR Mobile : une colonne, barre d'onglets en bas (à portée de pouce), mêmes couleurs que le logiciel. */
:root {
  --bg: #f5f3f2; --surface: #ffffff; --surface-2: #efeaea; --ink: #1b1416; --muted: #645a5c; --line: #e2dbdb;
  --brand: #8e1f33; --brand-ink: #ffffff; --brand-soft: #f6e4e7; --ok: #2f7a5b; --ok-soft: #e3f1ea; --warn: #a35a12; --warn-soft: #fbefe1;
  --danger: #b3261e; --danger-soft: #fbe5e3; --tag: #f2e6c4; --tag-ink: #3b2f12;
  --shadow: 0 1px 2px rgba(40, 10, 18, .06), 0 10px 26px -14px rgba(40, 10, 18, .3);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131012; --surface: #1d181a; --surface-2: #261f22; --ink: #f3ecee; --muted: #aa9fa2; --line: #352b2e;
    --brand: #d45a70; --brand-ink: #1a0b0f; --brand-soft: #3a1d24; --ok: #5cbf92; --ok-soft: #173327; --warn: #f0a55a; --warn-soft: #3a2a17;
    --danger: #f2867d; --danger-soft: #3d1e1c; --tag: #3b331f; --tag-ink: #f2e6c4;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131012; --surface: #1d181a; --surface-2: #261f22; --ink: #f3ecee; --muted: #aa9fa2; --line: #352b2e;
  --brand: #d45a70; --brand-ink: #1a0b0f; --brand-soft: #3a1d24; --ok: #5cbf92; --ok-soft: #173327; --warn: #f0a55a; --warn-soft: #3a2a17;
  --danger: #f2867d; --danger-soft: #3d1e1c; --tag: #3b331f; --tag-ink: #f2e6c4;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -16px rgba(0,0,0,.75);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); overscroll-behavior-y: contain; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* En-tête */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px);
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex: none; }
.logo svg { width: 20px; height: 20px; }
.top .titles { min-width: 0; flex: 1; }
.top h1 { font-size: 17px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .fresh { font: 500 12px/1.3 var(--f-mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.old { background: var(--warn); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; max-width: 720px; margin: 0 auto; }
.view { display: grid; gap: 16px; animation: in .35s var(--ease); }
main > *, .view > *, .card > *, .kpis > *, .item > * { min-width: 0; }
body { overflow-x: hidden; }
.chip.ex { white-space: normal; text-align: left; font-family: var(--f-body); font-size: 13px; padding: 6px 10px; }
@keyframes in { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.section-title { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 4px; }
.kpi .label { font-size: 12px; color: var(--muted); }
.kpi .value { font: 800 26px/1.1 var(--f-display); font-stretch: 72%; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.hero { grid-column: 1 / -1; background: var(--brand); color: var(--brand-ink); border: 0; }
.kpi.hero .label, .kpi.hero .sub { color: color-mix(in srgb, var(--brand-ink) 80%, transparent); }
.kpi.hero .value { font-size: 36px; }

.item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.item .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.ic.warning { background: var(--warn-soft); color: var(--warn); }
.ic.success { background: var(--ok-soft); color: var(--ok); }
.ic.info { background: var(--surface-2); color: var(--muted); }
.ic.danger { background: var(--danger-soft); color: var(--danger); }
.item strong { display: block; font-weight: 600; }
.item .d { font-size: 14px; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font: 500 12px/1.3 var(--f-mono); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }

.btn { appearance: none; border: 1px solid transparent; border-radius: 12px; padding: 12px 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px;
  transition: transform .2s var(--ease), opacity .2s ease; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-ghost { background: var(--surface); border-color: var(--line); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width: 100%; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type="text"], input[type="password"], input[type="number"], textarea, select {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
label.lbl { font-size: 14px; font-weight: 600; display: grid; gap: 6px; }
.qty { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; }
.qty input { text-align: center; padding: 10px 4px; }
.qty button { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; cursor: pointer; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 22px; height: 22px; accent-color: var(--brand); margin-top: 2px; flex: none; }

/* Onglets du bas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--brand); }
.tabs .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font: 600 11px/18px var(--f-body); padding: 0 5px; }

/* Feuille modale (code PIN, motifs) */
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; animation: up .3s var(--ease); max-height: 90vh; overflow: auto; }
@keyframes up { from { transform: translateY(100%); } }
.sheet h2 { font-size: 22px; font-weight: 750; font-stretch: 85%; }
.profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.profiles button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.profiles button[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.profiles button small { color: var(--muted); font-size: 12px; }
.pin { letter-spacing: .6em; text-align: center; font-size: 22px !important; font-family: var(--f-mono); }
.err { color: var(--danger); font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, 160%); background: var(--ink); color: var(--bg);
  padding: 12px 16px; border-radius: 14px; font-weight: 600; max-width: calc(100vw - 32px); transition: transform .35s var(--ease), opacity .25s ease, visibility .35s; box-shadow: var(--shadow); }
.toast { opacity: 0; visibility: hidden; }
.toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

/* Appairage */
.pair { min-height: 100vh; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 24px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px)); }
.pair-box { width: 100%; max-width: 440px; display: grid; gap: 18px; }
.pair h1 { font-size: 38px; line-height: 1; font-weight: 800; font-stretch: 70%; text-transform: uppercase; }
.pair h1 span { color: var(--brand); }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--muted); font-size: 15px; }
.install { background: var(--tag); color: var(--tag-ink); border-radius: 14px; padding: 14px; font-size: 14px; display: grid; gap: 6px; }

.answer { display: grid; gap: 8px; }
.answer table { width: 100%; border-collapse: collapse; font-size: 13px; }
.answer th, .answer td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.answer .scroll { overflow-x: auto; }
.pending { display: grid; gap: 6px; }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.links { display: grid; gap: 8px; }
.links a { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">OSCAR Mobile a besoin de JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
